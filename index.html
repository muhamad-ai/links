<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لینکەکانم</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     🎨 ڕەنگەکان — دەتوانیت لێرەدا بیانگۆڕیت
     ============================================================ */
  :root{
    --bg:#0a0a0a;
    --card:#141414;
    --card-2:#1c1c1c;
    --gold:#d4af37;
    --gold-soft:#e6c260;
    --line:rgba(212,175,55,.22);
    --txt:#f5f0e6;
    --muted:#9a9488;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Vazirmatn',system-ui,sans-serif;
    background:
      radial-gradient(900px 500px at 50% -10%, rgba(212,175,55,.10), transparent 60%),
      var(--bg);
    color:var(--txt);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 18px 56px;
  }
  .wrap{width:100%;max-width:440px}

  /* ---------- سەردێڕ / پرۆفایل ---------- */
  .head{text-align:center;margin-bottom:28px}
  .avatar{
    width:104px;height:104px;margin:0 auto 16px;
    border-radius:26px;
    background:linear-gradient(145deg,#1e1e1e,#0e0e0e);
    border:2px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 6px rgba(212,175,55,.08), 0 14px 40px rgba(0,0,0,.6);
    overflow:hidden;
  }
  .avatar img{width:100%;height:100%;object-fit:cover}
  .avatar span{font-size:44px;font-weight:900;color:var(--gold)}
  .name{font-size:24px;font-weight:900;letter-spacing:.3px}
  .bio{color:var(--muted);font-size:15px;margin-top:6px}

  /* ---------- دوگمەکانی ئەکاونت ---------- */
  .links{display:flex;flex-direction:column;gap:13px;margin-top:8px}
  .link{
    display:flex;align-items:center;gap:14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:15px 18px;
    text-decoration:none;color:var(--txt);
    font-size:17px;font-weight:700;
    transition:transform .15s ease, border-color .2s ease, background .2s ease;
  }
  .link:hover{transform:translateY(-2px);background:var(--card-2);border-color:var(--gold)}
  .link:active{transform:translateY(0)}
  .ico{
    width:44px;height:44px;border-radius:12px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
  }
  .ico svg{width:24px;height:24px;fill:#fff}
  .link .label{flex:1}
  .link .chev{color:var(--muted);font-size:20px}

  /* ---------- بەشی QR ---------- */
  .qr-box{
    margin-top:34px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:22px 20px;
    text-align:center;
  }
  .qr-box h2{font-size:18px;color:var(--gold-soft);margin-bottom:6px}
  .qr-box p{color:var(--muted);font-size:13px;margin-bottom:16px;line-height:1.7}
  .qr-input{
    width:100%;padding:13px 15px;border-radius:12px;
    border:1px solid var(--line);
    background:#0e0e0e;color:var(--txt);
    font-family:inherit;font-size:14px;text-align:left;direction:ltr;
    margin-bottom:12px;
  }
  .qr-input:focus{outline:none;border-color:var(--gold)}
  .btn{
    width:100%;padding:13px;border:none;border-radius:12px;
    background:linear-gradient(135deg,var(--gold),var(--gold-soft));
    color:#1a1400;font-family:inherit;font-weight:900;font-size:15px;
    cursor:pointer;transition:filter .15s ease;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{
    background:transparent;border:1px solid var(--gold);
    color:var(--gold);margin-top:10px;
  }
  #qrHolder{
    display:none;margin-top:18px;
    background:#fff;padding:16px;border-radius:16px;
    width:fit-content;margin-inline:auto;
  }
  #qrHolder canvas{display:block}

  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">

  <!-- ============================================================
       👤 زانیاری پرۆفایل
       ============================================================ -->
  <div class="head">
    <div class="avatar">
      <!-- بۆ وێنە: <img src="me.jpg" alt=""> بەکاربهێنە لە جیاتی span -->
      <span>ب</span>
    </div>
    <div class="name">بەهەند</div>
    <div class="bio">هەموو لینکەکانم لە یەک شوێن</div>
  </div>

  <!-- ============================================================
       🔗 ئەکاونتەکان
       دوگمەکان بەخۆکاری دروست دەبن لەسەر بنەمای LINKS لە خوارەوە
       ============================================================ -->
  <div class="links" id="links"></div>

  <!-- ============================================================
       📷 دروستکردنی QR
       ============================================================ -->
  <div class="qr-box">
    <h2>دروستکردنی QR Code</h2>
    <p>
      دوای ئەوەی ئەم پەڕەیە هۆست دەکەیت، لینکی تەواوی پەڕەکە لێرە دابنێ<br>
      (بۆ نموونە: https://your-name.web.app) و دوگمەکە دابگرە.
    </p>
    <input class="qr-input" id="qrUrl" placeholder="https://..." dir="ltr">
    <button class="btn" onclick="makeQR()">دروستکردنی QR</button>
    <div id="qrHolder"></div>
    <button class="btn ghost" id="dlBtn" style="display:none" onclick="downloadQR()">داونلۆدکردن (PNG)</button>
  </div>

  <div class="foot">Built with ITGate co</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

    url:"https://wa.me/9647501234567",

/* ---- دروستکردنی دوگمەکان بەخۆکاری ---- */
const box = document.getElementById('links');
LINKS.forEach(l=>{
  if(!l.url || l.url.includes('USERNAME') || l.url.includes('XXXX')) return; // دوگمە پڕنەکراوەکان دەشاردرێنەوە
  const a = document.createElement('a');
  a.className = 'link';
  a.href = l.url;
  a.target = '_blank';
  a.rel = 'noopener';
  a.innerHTML =
    '<span class="ico" style="background:'+l.color+'">'+l.icon+'</span>'+
    '<span class="label">'+l.name+'</span>'+
    '<span class="chev">‹</span>';
  box.appendChild(a);
});
if(!box.children.length){
  box.innerHTML = '<p style="color:#9a9488;text-align:center;font-size:14px;line-height:1.8">'+
    'هێشتا هیچ ئەکاونتێک پڕنەکراوەتەوە.<br>لە کۆدەکەدا (LINKS) ناوی بەکارهێنەر و ژمارەکانت دابنێ.</p>';
}

/* ---- جێنەرەیتەری QR ---- */
let qr;
function makeQR(){
  const url = document.getElementById('qrUrl').value.trim();
  if(!url){ alert('تکایە لینکەکە دابنێ'); return; }
  const holder = document.getElementById('qrHolder');
  holder.innerHTML = '<canvas id="qrCanvas"></canvas>';
  qr = new QRious({
    element: document.getElementById('qrCanvas'),
    value: url,
    size: 260,
    level: 'H',
    foreground: '#0a0a0a',
    background: '#ffffff'
  });
  holder.style.display = 'block';
  document.getElementById('dlBtn').style.display = 'block';
}
function downloadQR(){
  if(!qr) return;
  const a = document.createElement('a');
  a.download = 'my-qr.png';
  a.href = document.getElementById('qrCanvas').toDataURL('image/png');
  a.click();
}
</script>
</body>
</html>
